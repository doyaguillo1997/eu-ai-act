<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem("color-scheme");
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = savedScheme || "light dark";
        var resolved = savedScheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolved);
      } catch (e) {}
    </script>
    <title>EU AI Act Studio · Reglamento (UE) 2024/1689 (EUR-Lex / BOE)</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-hidden transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
